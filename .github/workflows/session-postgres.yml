name: Session PostgreSQL
on:
  pull_request:
  push:
    branches: [main]
jobs:
  session-postgres:
    name: PostgreSQL session integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: livi
          POSTGRES_PASSWORD: livi
          POSTGRES_DB: livi_session_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livi -d livi_session_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_SESSION_DATABASE_URL: postgres://livi:livi@127.0.0.1:5432/livi_session_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:session:postgres
      - run: pnpm test:session
